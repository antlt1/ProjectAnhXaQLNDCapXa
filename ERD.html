<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHONAI - ERD - rê chuột để xem giải thích cột</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  html,body{height:100%;margin:0}
  body{font-family:Segoe UI,Arial,sans-serif;background:#eef2f6;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;z-index:1200;display:flex;gap:8px;align-items:center;
       padding:7px 12px;background:#1f3b57;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);flex-wrap:wrap}
  #bar .ttl{font-weight:700;font-size:14px;margin-right:10px}
  #zoomv{font-size:13px;min-width:52px;text-align:center;opacity:.9}
  #stage{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
  #stage.drag{cursor:grabbing}
  #inner{position:absolute;top:56px;left:16px;transform-origin:0 0}
  #inner svg{display:block;max:none!important;height:auto}
  .mermaid svg text{cursor:help}
  #tip{position:fixed;z-index:2000;display:none;max-width:380px;pointer-events:none;
       background:rgba(18,26,36,.88);color:#fff;border:1px solid rgba(255,255,255,.25);
       border-radius:10px;padding:10px 13px;box-shadow:0 10px 30px rgba(0,0,0,.45);
       backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:13px;line-height:1.45}
  #tip .col-name{font-weight:700;font-size:14px;color:#8fd0ff;word-break:break-word}
  #tip .sub{font-size:11px;opacity:.75;margin-bottom:4px;word-break:break-word}
  #tip .badge{margin-right:4px;vertical-align:middle}
  .hint{font-size:12px;opacity:.85;margin-left:auto}
</style>
</head>
<body>
<div id="bar" class="shadow-sm">
  <span class="ttl">ERD NHONAI</span>
  <button id="minus" class="btn btn-sm btn-outline-light">&#8722;</button>
  <span id="zoomv">160%</span>
  <button id="plus" class="btn btn-sm btn-outline-light">+</button>
  <button id="reset" class="btn btn-sm btn-outline-light">Mặc định</button>
  <button id="fit" class="btn btn-sm btn-outline-light">Vừa màn hình</button>
  <span class="hint">Lăn chuột = zoom &nbsp;|&nbsp; Kéo chuột = di chuyển &nbsp;|&nbsp; Rê chuột lên cột / bảng để xem giải thích</span>
</div>
<div id="stage">
  <div id="inner"><pre class="mermaid" id="mmd"></pre></div>
</div>
<div id="tip"></div>

function describe(col){
  if(DESC[col]) return DESC[col];
  if(/^p\d+$/.test(col)) return 'Ô số liệu báo cáo p1..p76.';
  if(/^(XBS|HBS|TBS)\d+$/.test(col)) return 'Chỉ tiêu thống kê theo biểu mẫu (XBS/HBS/TBS).';
  if(/Date/i.test(col)) return 'Ngày / thời gian.';
  if(/^Is[A-Z]/.test(col)) return 'Đúng / sai (có / không).';
  if(/Code_Old$/.test(col)) return 'Mã cũ (để đối chiếu).';
  if(/_Old$/.test(col)) return 'Giá trị cũ (lưu trữ).';
  if(/_Name$/.test(col)) return 'Tên (gọi tên).';
  if(/_ID$/.test(col)) return 'Mã khóa (khóa ngoại tham chiếu bảng liên quan).';
  if(/_Code$/.test(col)) return 'Mã danh mục.';
  if(/_Number$/.test(col)) return 'Số / số lượng.';
  if(/_Status$/.test(col)) return 'Trạng thái.';
  if(/^Total_/.test(col)) return 'Tổng số.';
  if(/^(Expense|Spend|Investment|Money)/.test(col)) return 'Chi phí / kinh phí.';
  return 'Cột ' + col + '.';
}

// ---- doc schema ----
const tables = [];
const index = {};
for(const line of SCHEMA.split('\n')){
  const s = line.replace(/\r$/,'').trim();
  if(!s) continue;
  const p = s.split('|');
  const t = p[0], c = p[1], pk = (p[2]||'') === 'PK', ty = p[3]||'';
  if(!index[t]){ index[t] = []; tables.push(t); }
  index[t].push({c, pk, ty});
}
const fkSet = {};
for(const r of RELS){ fkSet[r[0] + '.' + r[2]] = true; }

// ---- build mermaid ----
let def = 'erDiagram\n';
for(const r of RELS){ def += '  ' + r[1] + ' ||--o{ ' + r[0] + ' : "' + r[2] + '"\n'; }
for(const t of tables){
  def += '  ' + t + ' {\n';
  for(const col of index[t]){
    const ty = (col.ty || 'string').toLowerCase();
    let key = '';
    if(col.pk) key = 'PK';
    else if(fkSet[t + '.' + col.c]) key = 'FK';
    def += '    ' + ty + ' ' + col.c + (key ? ' ' + key : '') + '\n';
  }
  def += '  }\n';
}
document.getElementById('mmd').textContent = def;

// ---- col index ----
var colIndex = {};
(function(){
  for(var t of tables){
    for(var col of index[t]){
      var key = col.c;
      if(!colIndex[key]) colIndex[key] = {tables:[], ty:col.ty, pk:false, fk:false};
      if(colIndex[key].tables.indexOf(t) < 0) colIndex[key].tables.push(t);
      if(col.pk) colIndex[key].pk = true;
      if(fkSet[t + '.' + col.c]) colIndex[key].fk = true;
    }
  }
})();
function colOf(name){ return colIndex[name] || null; }
var tableSet = {}; for(var tt of tables) tableSet[tt.toLowerCase()] = tt;

// ---- zoom / pan ----
var scale = 1.6, tx = 20, ty = 20;
var inner = document.getElementById('inner');
var stage = document.getElementById('stage');
var zv = document.getElementById('zoomv');
function apply(){ inner.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; zv.textContent = Math.round(scale*100)+'%'; }
document.getElementById('plus').onclick = function(){ scale=Math.min(scale+0.2,8); apply(); };
document.getElementById('minus').onclick = function(){ scale=Math.max(scale-0.2,0.15); apply(); };
document.getElementById('reset').onclick = function(){ scale=1.6; tx=20; ty=20; apply(); };
document.getElementById('fit').onclick = function(){
  var svg = document.querySelector('#inner svg');
  if(!svg) return;
  var r = svg.getBoundingClientRect();
  var s = Math.min((window.innerWidth-40)/r.width, (window.innerHeight-80)/r.height);
  scale = s; tx = 20; ty = 20; apply(); setTimeout(apply,50);
};
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  var rect = stage.getBoundingClientRect();
  var mx = e.clientX-rect.left, my = e.clientY-rect.top, old = scale;
  scale = Math.min(Math.max(scale*(e.deltaY<0?1.12:1/1.12),0.15),8);
  tx = mx-(mx-tx)*(scale/old); ty = my-(my-ty)*(scale/old); apply();
},{passive:false});
var drag=false,lx=0,ly=0;
stage.addEventListener('mousedown', function(e){ if(e.button!==0) return; drag=true; lx=e.clientX; ly=e.clientY; stage.classList.add('drag'); });
window.addEventListener('mouseup', function(){ drag=false; stage.classList.remove('drag'); });
window.addEventListener('mousemove', function(e){ if(!drag) return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); });

// ---- tooltip ----
var tip = document.getElementById('tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.display='block';
  var w = tip.offsetWidth, h = tip.offsetHeight;
  var nx = x + 16, ny = y + 16;
  if(nx + w > window.innerWidth) nx = x - w - 16;
  if(ny + h > window.innerHeight) ny = y - h - 16;
  tip.style.left = Math.max(6,nx)+'px'; tip.style.top = Math.max(6,ny)+'px';
}
function hideTip(){ tip.style.display='none'; }
function onMove(e){
  var el = e.target;
  if(el && el.tagName && el.tagName.toLowerCase()==='text'){
    var txt = (el.textContent||'').trim();
    var toks = txt.split(/\s+/);
    var col=null, tbl=null;
    for(var tok of toks){
      if(colOf(tok)){ col = tok; }
      else if(tableSet[tok.toLowerCase()]){ tbl = tableSet[tok.toLowerCase()]; }
    }
    if(col){
      var info = colOf(col);
      var badges = '';
      if(info.pk) badges += '<span class="badge text-bg-warning text-dark">PK</span>';
      if(info.fk) badges += '<span class="badge text-bg-info text-dark">FK</span>';
      showTip('<div class="col-name">'+col+'</div><div class="sub">'+info.tables.join(', ')+' &middot; '+info.ty+'</div>'+badges+'<div class="mt-1">'+describe(col)+'</div>', e.clientX, e.clientY);
      el.style.fill = '#c0392b'; el.style.fontWeight='bold';
      return;
    }
    if(tbl){
      showTip('<div class="col-name">'+tbl+'</div><div class="sub">Bảng</div><div class="mt-1">'+(TDESC[tbl]||('Bảng '+tbl+'.'))+'</div>', e.clientX, e.clientY);
      el.style.fill = '#c0392b'; el.style.fontWeight='bold';
      return;
    }
  }
  hideTip();
}
function onOut(e){
  var el = e.target;
  if(el && el.tagName && el.tagName.toLowerCase()==='text'){ el.style.fill=''; el.style.fontWeight=''; }
}
stage.addEventListener('mousemove', onMove);
stage.addEventListener('mouseout', onOut);

mermaid.initialize({startOnLoad:false, theme:'default', maxTextSize:2000000, maxEdges:2000, er:{useMaxWidth:false}});
window.addEventListener('load', function(){
  mermaid.run({querySelector:'#mmd'}).then(function(){ setTimeout(apply, 400); }).catch(function(err){ console.error(err); });
});
</script>
